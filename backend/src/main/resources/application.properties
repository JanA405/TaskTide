spring.application.name=demo
server.forward-headers-strategy=framework

# Database Configuration (H2 Embedded Database with file persistence)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/tide_tsk;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:demoSecretKeyForJwtTokenGenerationAndValidation123456}
jwt.expiration=86400000

logging.level.org.springframework.security=DEBUG
